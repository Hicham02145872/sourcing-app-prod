[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:tracking-server]
command=/opt/venv/bin/python /var/www/html/scraper/tracking_server.py --host 0.0.0.0 --port 5001
directory=/var/www/html/scraper
user=www-data
autostart=true
autorestart=true
startsecs=15
stopwaitsecs=30
environment=
    CHROME_BINARY_PATH="/usr/bin/google-chrome",
    CHROMEDRIVER_PATH="/usr/bin/chromedriver",
    HOME="/var/www/html/storage/app/python_home",
    PYTHONIOENCODING="utf-8",
    PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
