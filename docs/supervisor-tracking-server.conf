; =============================================================================
; Supervisor config — Selenium Tracking Server (P1.1)
; =============================================================================
; INSTALL:
;   sudo cp /var/www/sourcing-app/docs/supervisor-tracking-server.conf \
;           /etc/supervisor/conf.d/sourcing-tracking.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status sourcing-tracking-server
;
; VERIFY:
;   curl http://127.0.0.1:5001/health
;
; LOGS:
;   tail -f /var/www/sourcing-app/storage/logs/tracking-server.log
; =============================================================================

[program:sourcing-tracking-server]

; --- Command ---------------------------------------------------------------
; Adjust TRACKING_PYTHON_PATH in .env or point directly to the venv python
command=/var/www/sourcing-app/venv/bin/python /var/www/sourcing-app/scraper/tracking_server.py --host 127.0.0.1 --port 5001
; Add --no-eager-init to delay Chrome startup until first request (saves RAM at boot)

; --- Working dir -----------------------------------------------------------
directory=/var/www/sourcing-app/scraper

; --- User ------------------------------------------------------------------
; Same user as php-fpm so file permissions match
user=www-data

; --- Restart policy --------------------------------------------------------
autostart=true
autorestart=true
startsecs=15          ; Chrome takes ~10s to init, give extra margin
stopwaitsecs=30       ; Let Chrome close cleanly

; --- Environment -----------------------------------------------------------
; These override .env values for this specific process
; Adjust CHROME_BINARY_PATH and CHROMEDRIVER_PATH to your actual paths
environment=
    CHROME_BINARY_PATH="/usr/bin/google-chrome",
    CHROMEDRIVER_PATH="/usr/bin/chromedriver",
    HOME="/var/www/sourcing-app/storage/app/python_home",
    PYTHONIOENCODING="utf-8",
    PYTHONUNBUFFERED="1"

; --- Logging ---------------------------------------------------------------
stdout_logfile=/var/www/sourcing-app/storage/logs/tracking-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/sourcing-app/storage/logs/tracking-server-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

; --- Priority --------------------------------------------------------------
; Start after PHP-FPM and MySQL (higher = later)
priority=200
