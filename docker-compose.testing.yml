# =============================================================================
# Docker Compose — E2E Testing (SmartSourcing)
# Usage: docker compose -f docker-compose.testing.yml --env-file .env.testing up -d --build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PHP-FPM Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile.testing
      target: ""  # use last stage
    image: smartsourcing/testing:latest
    container_name: ss-test-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
      - ./docker/php/zz-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: s_app_testing
      DB_USERNAME: sourcing
      DB_PASSWORD: testing_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ss-test

  # ---------------------------------------------------------------------------
  # Nginx Web Server
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ss-test-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - app_storage:/var/www/html/storage:ro
      - app_bootstrap:/var/www/html/bootstrap/cache:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ss-test

  # ---------------------------------------------------------------------------
  # Queue Worker
  # ---------------------------------------------------------------------------
  queue:
    image: smartsourcing/testing:latest
    container_name: ss-test-queue
    restart: unless-stopped
    command: php artisan queue:work database --tries=3 --queue=default,mail --sleep=1
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
      - ./docker/php/zz-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: s_app_testing
      DB_USERNAME: sourcing
      DB_PASSWORD: testing_secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - ss-test

  # ---------------------------------------------------------------------------
  # Scheduler (Cron)
  # ---------------------------------------------------------------------------
  scheduler:
    image: smartsourcing/testing:latest
    container_name: ss-test-scheduler
    restart: unless-stopped
    command: >
      sh -c "echo '* * * * * php /var/www/html/artisan schedule:run >> /dev/null 2>&1' > /etc/cron.d/laravel && chmod 0644 /etc/cron.d/laravel && crontab /etc/cron.d/laravel && cron -f"
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
      - ./docker/php/zz-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: s_app_testing
      DB_USERNAME: sourcing
      DB_PASSWORD: testing_secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ss-test

  # ---------------------------------------------------------------------------
  # Vite Dev Server
  # ---------------------------------------------------------------------------
  vite:
    image: node:22-alpine
    container_name: ss-test-vite
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    volumes:
      - .:/app
    environment:
      APP_ENV: testing
      VITE_HMR_HOST: vite
    networks:
      - ss-test

  # ---------------------------------------------------------------------------
  # MySQL 8.0
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: ss-test-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: s_app_testing
      MYSQL_ROOT_PASSWORD: testing_root_secret
      MYSQL_PASSWORD: testing_secret
      MYSQL_USER: sourcing
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptesting_root_secret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ss-test

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ss-test-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ss-test

  # ---------------------------------------------------------------------------
  # Playwright Test Runner
  # ---------------------------------------------------------------------------
  playwright:
    image: mcr.microsoft.com/playwright:v1.56.0-noble
    container_name: ss-test-playwright
    working_dir: /app
    volumes:
      - .:/app
      - app_storage:/app/storage
      - app_bootstrap:/app/bootstrap/cache
      - playwright_results:/app/tests/e2e/results
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: s_app_testing
      DB_USERNAME: sourcing
      DB_PASSWORD: testing_secret
      REDIS_HOST: redis
      BASE_URL: http://nginx
    depends_on:
      app:
        condition: service_started
      nginx:
        condition: service_started
      queue:
        condition: service_started
      vite:
        condition: service_started
    command: >
      sh -c "
        echo 'Waiting for app to be ready...' &&
        sleep 10 &&
        echo 'Running Playwright tests...' &&
        npx playwright test --reporter=list 2>&1 ||
        (echo 'Tests failed!' && exit 1)
      "
    networks:
      - ss-test

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  app_bootstrap:
    driver: local
  playwright_results:
    driver: local

networks:
  ss-test:
    driver: bridge
